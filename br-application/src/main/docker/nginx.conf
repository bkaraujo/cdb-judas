# ============================================================================
# nginx site config (drop-in para /etc/nginx/conf.d/default.conf).
#
# Serve o frontend estático E faz proxy reverso das rotas do backend no MESMO
# host/porta. O JS do frontend usa window.API_BASE_URL = '/api' (same-origin)
# para origens http, então estático e API precisam conviver aqui.
#
# O backend Quarkus é alcançável na rede do compose em http://backend:8080.
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------------
    # Cabeçalhos comuns de proxy, reaproveitados por cada location de backend.
    # Host + X-Forwarded-* só importam para logging/observabilidade — a
    # autenticação é por token (X-Access-Token), sem sessão/cookie: o nginx
    # não precisa fazer nada de especial para o token passar (é só um header).
    # ------------------------------------------------------------------------

    # ------------------------------------------------------------------------
    # SSE: stream de eventos em /api/{uuid}/stream (regex ^/api/.+/stream$).
    # Esta location usa regex (~) e por isso é avaliada ANTES do prefixo /api/,
    # garantindo precedência. Buffering/cache DESLIGADOS: caso contrário o nginx
    # acumularia os eventos e o cliente os receberia em lote/atrasados.
    # ------------------------------------------------------------------------
    location ~ ^/api/.+/stream$ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # ------------------------------------------------------------------------
    # API REST: todos os demais /api/... (endpoints sob o namespace do uuid).
    # ------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------------
    # Autenticação: POST /login emite X-Access-Token (sem sessão/cookie; não
    # há /logout no servidor — o cliente só descarta o token).
    # ------------------------------------------------------------------------
    location = /login {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------------
    # Swagger UI (customizado para /swagger; default do Quarkus seria /q/swagger-ui).
    # ------------------------------------------------------------------------
    location /swagger {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------------
    # Endpoints de gestão do Quarkus: documento OpenAPI (/q/openapi) e health
    # (/q/health, /q/health/live, /q/health/ready) — incluído por conveniência.
    # ------------------------------------------------------------------------
    location /q/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------------
    # Assets estáticos versionados: cache curto (1h). Nunca casa index.html.
    # ------------------------------------------------------------------------
    location ~* \.(css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------------
    # Site estático com fallback estilo SPA. index.html nunca é cacheado para
    # que novas versões do app sejam buscadas a cada navegação.
    # ------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
