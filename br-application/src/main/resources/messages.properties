# Bundle raiz (pt-BR) das mensagens de BusinessError — fallback de última instância para qualquer
# locale não reconhecido. Ver br.commons.i18n.Messages / br.commons.business.BusinessError#render.
#
# Chave prefixada pela fatia que a define (fNNN) — quando o mesmo texto é levantado por mais de uma
# fatia (ex.: f000.UserGuards perguntando se uma conta existe), a chave carrega o prefixo da fatia
# dona da entidade (aqui, f002 — Account), e a fatia consumidora só referencia a mesma string.

