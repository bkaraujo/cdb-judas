# ##########################################################################
# Quarkus — o log da APLICAÇÃO usa o Logger próprio (br.commons), configurado
# por variáveis de ambiente APP_LOGLEVEL_* no bootstrap. Aqui só o log interno
# do Quarkus/RESTEasy.
# ##########################################################################
quarkus.log.level=INFO
quarkus.banner.enabled=false

# HTTP -----------------------------------------------------------------------
quarkus.http.port=8080
# Backstop de upload multipart (import de fatura). Limite amigável por arquivo
# é aplicado no use case de importação.
quarkus.http.limits.max-body-size=20M

# NOTA: a configuração da aplicação (árvore `cdb.*`) NÃO mora aqui — mora em
# `application.yaml` na raiz do repositório, lido pelo CoreModule via br.commons.Yaml
# (caminho na system property `cdb.application.yaml`; nos testes o surefire aponta para
# application.test.yaml). Isto inclui datasource, base-url do InternalApi, timeout de
# sessão e a versão exposta em /api/version. Este arquivo é só para `quarkus.*`.

# CORS (equivalente ao antigo CorsConfigurationSource) -----------------------
# `quarkus.http.cors` (sem `.enabled`) foi renomeado na 3.4 e hoje é uma chave
# desconhecida (silenciosamente ignorada, só um WARN no log) — o filtro de CORS
# nunca ativava de fato. Só apareceu porque testes via curl/RestAssured não
# aplicam CORS (é enforcement do browser); só quebrava de verdade num browser real.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=*
quarkus.http.cors.exposed-headers=X-Access-Token,X-User-Id
quarkus.http.cors.access-control-allow-credentials=true

# OpenAPI / Swagger UI -------------------------------------------------------
quarkus.swagger-ui.enabled=true
quarkus.swagger-ui.path=/swagger
quarkus.swagger-ui.always-include=true
# info.version dinâmico (equivalente ao antigo BuildProperties do Spring); @Info.version é só um
# placeholder porque a anotação exige um valor não-vazio.
quarkus.smallrye-openapi.info-version=${quarkus.application.version}

# Storage JSON (stack próprio) -----------------------------------------------
# Vestigial: JsonStorageConfig ainda produz o bean Storage, mas nenhum agregado usa.
# JsonStorageConfig continua necessário como ObjectMapperCustomizer (Jackson).
%test.storage.json.path=${java.io.tmpdir}/sas-finance-tests

# DataSource: ver `application.yaml` (cdb.datasource.*) — as chaves `datasource.jdbc.*`
# que viviam aqui foram removidas por não terem mais consumidor.

# i18n -------------------------------------------------------------------------
# Locales suportados pelas mensagens de erro (BusinessError, ver br.commons.i18n.Messages) e de Bean
# Validation. quarkus-hibernate-validator já resolve o locale por requisição sozinho a partir de
# Accept-Language (ResteasyReactiveLocaleResolver, negocia contra esta lista) — nenhum wiring extra
# precisa ser escrito para ValidationMessages_pt_BR.properties funcionar por requisição.
quarkus.default-locale=pt-BR
quarkus.locales=pt-BR,en-US
