# Overrides pt-BR das chaves padrão do Jakarta Validation efetivamente usadas no projeto (grep por
# anotação em br-application/src/main/java) — só as usadas, não o vocabulário completo da spec.
# Placeholders ({min}, {max}, {value}, {regexp}) são resolvidos pelo próprio Hibernate Validator,
# preservados intactos.
jakarta.validation.constraints.NotBlank.message=não pode estar em branco
jakarta.validation.constraints.NotNull.message=não pode ser nulo
jakarta.validation.constraints.NotEmpty.message=não pode estar vazio
jakarta.validation.constraints.Size.message=o tamanho deve estar entre {min} e {max}
jakarta.validation.constraints.Pattern.message=deve corresponder ao padrão "{regexp}"
jakarta.validation.constraints.Min.message=deve ser maior ou igual a {value}
jakarta.validation.constraints.Max.message=deve ser menor ou igual a {value}
jakarta.validation.constraints.PositiveOrZero.message=deve ser maior ou igual a 0

# Chaves customizadas do projeto (ver ValidationMessages.properties raiz).
cdb.validation.twoDecimalPlaces=deve ter no máximo 2 casas decimais
cdb.validation.closingFormat=Formato inválido. Use AAAA-MM
