<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBD Finance</title>
  <!-- No-flash theme: apply the mirror-cached theme before first paint. -->
  <script>
    (function () {
      try {
        const raw = localStorage.getItem('cbd-preferences');
        let t = raw ? JSON.parse(raw).theme : null;
        if (!t) t = localStorage.getItem('cbd-theme'); /* legacy single-key layout */
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* storage unavailable */ }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>

  <!-- jQuery 4 beta (stable 4.x not yet released). TODO: swap to GA when available. -->
  <script src="https://code.jquery.com/jquery-4.0.0.slim.min.js"></script>

  <!-- API base URL: same-origin '/api' quando servido pelo Spring Boot (localhost:8080);
       absoluto p/ localhost:8080 quando aberto direto do disco via file:// (cross-origin). -->
  <script>
    window.API_BASE_URL = (location.protocol === 'file:')
      ? 'http://localhost:8080/api'
      : '/api';
  </script>

  <!-- ── Único entrypoint: kernel → fatias → legado → composition-root (async=false preserva ordem) ── -->
  <script src="core/boot.js"></script>
</body>
</html>
