<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CDB Finance — Test Harness (QUnit)</title>
  <!-- Dev-only. Nunca referenciado por web/index.html nem core/boot.js.
       Excluído do jar de produção (br-application/pom.xml, test/**). -->
  <link rel="stylesheet" href="vendor/qunit-2.24.1.css">
</head>
<body>
  <div id="qunit"></div>
  <div id="qunit-fixture"></div>

  <script src="../vendor/jquery-4.0.0.slim.min.js"></script>
  <script src="vendor/qunit-2.24.1.js"></script>
  <script src="../core/manifest.js"></script>

  <script>
    (function () {
      function inject(src) {
        const s = document.createElement('script');
        s.src = '../' + src;
        s.async = false;
        document.head.appendChild(s);
      }
      // Mesma lista/ordem de core/kernel/kernel.barrel.js + core/boot.js — lida de
      // window.CDB_MANIFEST (core/manifest.js) em vez de cópia local, pra não divergir de novo.
      // Este harness vive um nível abaixo de web/, daí o prefixo '../'. Não carrega
      // core/composition-root/** — é quem faz o wiring de DI real (HTTP de verdade, renderiza a
      // SPA em #app); testes injetam repo fake em vez disso.
      const k = window.CDB_MANIFEST.kernel;
      const kernelFiles = []
        .concat(k.domain.map(function (p) { return 'core/kernel/_0_domain/' + p; }))
        .concat(k.application.map(function (p) { return 'core/kernel/_1_application/' + p; }))
        .concat(k.secondary.map(function (p) { return 'core/kernel/_2_infrastructure/secondary/' + p; }))
        .concat(k.primary.map(function (p) { return 'core/kernel/_2_infrastructure/primary/' + p; }));

      kernelFiles.concat(window.CDB_MANIFEST.feature).forEach(inject);
    })();
  </script>

  <!-- Testes: uma linha por arquivo-fonte coberto (ver web/CLAUDE.md padrão 009 pra somar mais). -->
  <script src="kernel/account.test.js"></script>
  <script src="kernel/transaction.test.js"></script>
  <script src="kernel/money.test.js"></script>
  <script src="kernel/period.test.js"></script>
  <script src="kernel/category.test.js"></script>
  <script src="kernel/tag.test.js"></script>
  <script src="kernel/invoice.test.js"></script>
  <script src="kernel/statement-item.test.js"></script>
  <script src="kernel/statement-row.test.js"></script>
  <script src="feature/budget.test.js"></script>
  <script src="feature/accounts-payable.test.js"></script>
  <script src="feature/accounts.test.js"></script>
  <script src="feature/transactions.test.js"></script>
  <script src="feature/credit-cards.test.js"></script>
  <script src="feature/categories.test.js"></script>
  <script src="feature/cost-centers.test.js"></script>
  <script src="feature/tags.test.js"></script>
  <script src="feature/import-rules.test.js"></script>
  <script src="feature/statement.test.js"></script>
  <script src="feature/dashboard.test.js"></script>
</body>
</html>
