<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBD Finance</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font: 'Plus Jakarta Sans', sans-serif;
      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 16px;
      --transition: 0.18s ease;
    }

    [data-theme="dark"] {
      --bg-base:    #0D1526;
      --bg-surface: #16213E;
      --bg-card:    #1B2A4A;
      --bg-hover:   #213358;
      --border:     #263554;
      --border-light: #1B2A4A;
      --text-primary:   #E8EDF5;
      --text-secondary: #8B9CC4;
      --text-muted:     #5A6A8A;
      --accent:         #6366F1;
      --accent-hover:   #4F46E5;
      --accent-light:   rgba(99,102,241,0.15);
      --accent-glow:    rgba(99,102,241,0.25);
      --income:         #10B981;
      --income-light:   rgba(16,185,129,0.15);
      --expense:        #F43F5E;
      --expense-light:  rgba(244,63,94,0.15);
      --warning:        #F59E0B;
      --warning-light:  rgba(245,158,11,0.12);
      --info:           #38BDF8;
      --info-light:     rgba(56,189,248,0.12);
      --sidebar-bg:     #0D1526;
      --scrollbar:      #263554;
      --sidebar-text:   #8B9CC4;
      --sidebar-active-bg: rgba(99,102,241,0.15);
      --sidebar-active: #6366F1;
    }

    [data-theme="light"] {
      --bg-base:    #F0F4FF;
      --bg-surface: #FFFFFF;
      --bg-card:    #FFFFFF;
      --bg-hover:   #F5F7FF;
      --border:     #DDE3F0;
      --border-light: #EEF1F8;
      --text-primary:   #0F1D35;
      --text-secondary: #4F5E7A;
      --text-muted:     #8B97B0;
      --accent:         #4F46E5;
      --accent-hover:   #4338CA;
      --accent-light:   rgba(79,70,229,0.08);
      --accent-glow:    rgba(79,70,229,0.15);
      --income:         #059669;
      --income-light:   rgba(5,150,105,0.1);
      --expense:        #E11D48;
      --expense-light:  rgba(225,29,72,0.08);
      --warning:        #D97706;
      --warning-light:  rgba(217,119,6,0.08);
      --info:           #0284C7;
      --info-light:     rgba(2,132,199,0.08);
      --sidebar-bg:     #FFFFFF;
      --scrollbar:      #DDE3F0;
    }

    html, body, #root {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font);
      background: var(--bg-base);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

    * { transition: background-color var(--transition), border-color var(--transition), color var(--transition); }

    input, select, textarea {
      font-family: var(--font);
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    button { font-family: var(--font); cursor: pointer; border: none; outline: none; }

    .app-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
    }

    /* Header */
    .header {
      height: 56px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
      gap: 16px;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .header-right { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      width: 36px; height: 36px;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition);
    }
    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    /* Tabs */
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab {
      padding: 10px 18px; font-size: 14px; font-weight: 500;
      color: var(--text-secondary); background: transparent; border: none;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      cursor: pointer; transition: all var(--transition);
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:hover:not(.active) { color: var(--text-primary); }

    /* Page header */
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    .page-header h1 { font-size: 20px; font-weight: 700; }
    .page-header-actions { display: flex; gap: 8px; align-items: center; }

    /* Tooltip */
    .tooltip-wrap { position: relative; }
    .tooltip-wrap .tooltip {
      position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
      margin-left: 10px; background: #0A1120; color: #E8EDF5;
      font-size: 12px; font-weight: 500; padding: 5px 10px;
      border-radius: 6px; white-space: nowrap; pointer-events: none;
      opacity: 0; transition: opacity 0.15s;
      border: 1px solid #263554;
      z-index: 1000;
    }
    .tooltip-wrap:hover .tooltip { opacity: 1; }

    /* Modal overlay */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; backdrop-filter: blur(4px);
    }
    .modal-box {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 24px;
      width: 560px; max-width: 95vw; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-header h3 { font-size: 16px; font-weight: 700; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1/-1; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }

    /* Animations */
    .fade-in { opacity: 1 !important; }
    .slide-in { opacity: 1 !important; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components/theme.jsx"></script>
<script type="text/babel" src="components/sidebar.jsx"></script>
<script type="text/babel" src="components/dashboard.jsx"></script>
<script type="text/babel" src="components/lancamentos.jsx"></script>
<script type="text/babel" src="components/orcamento.jsx"></script>
<script type="text/babel" src="components/relatorios.jsx"></script>
<script type="text/babel" src="components/screens.jsx"></script>
<script type="text/babel" src="components/main.jsx"></script>
<script>
// Force visibility after React mounts
function forceVisible() {
  document.querySelectorAll('.fade-in,.slide-in').forEach(el => {
    el.style.opacity = '1';
    el.style.animation = 'none';
  });
}
// Run after Babel/React finishes
setTimeout(forceVisible, 100);
setTimeout(forceVisible, 500);
// Also observe DOM mutations for future renders
const obs = new MutationObserver(() => {
  document.querySelectorAll('.fade-in,.slide-in').forEach(el => {
    el.style.opacity = '1';
    el.style.animation = 'none';
  });
});
obs.observe(document.getElementById('root'), { childList: true, subtree: true });
</script>
</body>
</html>
