<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAS Finance</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font: 'Plus Jakarta Sans', sans-serif;
      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 16px;
      --transition: 0.18s ease;
    }

    [data-theme="dark"] {
      --bg-base:    #0D1526;
      --bg-surface: #16213E;
      --bg-card:    #1B2A4A;
      --bg-hover:   #213358;
      --border:     #263554;
      --border-light: #1B2A4A;
      --text-primary:   #E8EDF5;
      --text-secondary: #8B9CC4;
      --text-muted:     #5A6A8A;
      --accent:         #6366F1;
      --accent-hover:   #4F46E5;
      --accent-light:   rgba(99,102,241,0.15);
      --accent-glow:    rgba(99,102,241,0.25);
      --income:         #10B981;
      --income-light:   rgba(16,185,129,0.15);
      --expense:        #F43F5E;
      --expense-light:  rgba(244,63,94,0.15);
      --warning:        #F59E0B;
      --warning-light:  rgba(245,158,11,0.12);
      --info:           #38BDF8;
      --info-light:     rgba(56,189,248,0.12);
      --sidebar-bg:     #0D1526;
      --scrollbar:      #263554;
      --sidebar-text:   #8B9CC4;
      --sidebar-active-bg: rgba(99,102,241,0.15);
      --sidebar-active: #6366F1;
    }

    [data-theme="light"] {
      --bg-base:    #F0F4FF;
      --bg-surface: #FFFFFF;
      --bg-card:    #FFFFFF;
      --bg-hover:   #F5F7FF;
      --border:     #DDE3F0;
      --border-light: #EEF1F8;
      --text-primary:   #0F1D35;
      --text-secondary: #4F5E7A;
      --text-muted:     #8B97B0;
      --accent:         #4F46E5;
      --accent-hover:   #4338CA;
      --accent-light:   rgba(79,70,229,0.08);
      --accent-glow:    rgba(79,70,229,0.15);
      --income:         #059669;
      --income-light:   rgba(5,150,105,0.1);
      --expense:        #E11D48;
      --expense-light:  rgba(225,29,72,0.08);
      --warning:        #D97706;
      --warning-light:  rgba(217,119,6,0.08);
      --info:           #0284C7;
      --info-light:     rgba(2,132,199,0.08);
      --sidebar-bg:     #FFFFFF;
      --scrollbar:      #DDE3F0;
      --sidebar-text:   #4F5E7A;
      --sidebar-active-bg: rgba(79,70,229,0.08);
      --sidebar-active: #4F46E5;
    }

    html, body { height: 100%; width: 100%; overflow: hidden; }

    body {
      font-family: var(--font);
      background: var(--bg-base);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

    .t-all { transition: background-color var(--transition), border-color var(--transition), color var(--transition); }

    input, select, textarea {
      font-family: var(--font);
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }
    button { font-family: var(--font); cursor: pointer; border: none; outline: none; }

    /* ── Layout ── */
    .app-layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
    .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .page-content { flex: 1; overflow-y: auto; padding: 24px 28px; }

    .header {
      height: 56px; background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; flex-shrink: 0; gap: 16px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .header-right { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      background: transparent; color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition); flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .icon-btn.sm { width: 28px; height: 28px; }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px; background: var(--sidebar-bg);
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      transition: width 0.22s cubic-bezier(.4,0,.2,1);
      flex-shrink: 0; overflow: hidden; color: var(--text-primary);
    }
    .sidebar.collapsed { width: 60px; }
    .sidebar-head {
      height: 56px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px 0 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .sidebar.collapsed .sidebar-head { justify-content: center; padding: 0; }
    .logo-mark {
      width: 28px; height: 28px; border-radius: 8px; background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 13px; flex-shrink: 0;
    }
    .logo-text { font-weight: 800; font-size: 15px; letter-spacing: -0.02em; }
    .sidebar-nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 0; }
    .nav-item-wrap { padding: 1px 8px; position: relative; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 8px 10px; border-radius: var(--radius-sm);
      background: transparent; color: var(--text-secondary);
      font-size: 13px; font-weight: 400; white-space: nowrap;
      transition: all var(--transition);
    }
    .sidebar.collapsed .nav-item { justify-content: center; }
    .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-item.active { background: var(--sidebar-active-bg); color: var(--sidebar-active); font-weight: 600; }
    .nav-item.group-open { color: var(--text-primary); }
    .nav-label { flex: 1; text-align: left; }
    .nav-sub { padding: 2px 8px 4px 8px; }
    .nav-subitem {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 7px 10px 7px 28px; border-radius: var(--radius-sm);
      font-size: 13px; background: transparent; color: var(--text-secondary);
      font-weight: 400; white-space: nowrap; transition: all var(--transition);
    }
    .nav-subitem:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-subitem.active { background: var(--sidebar-active-bg); color: var(--sidebar-active); font-weight: 600; }
    .sidebar-foot { border-top: 1px solid var(--border); padding: 10px 8px; display: flex; flex-direction: column; gap: 4px; }
    .sidebar-foot .icon-btn { width: 100%; gap: 8px; height: 36px; }

    .tooltip-wrap { position: relative; }
    .tooltip-wrap .tooltip {
      position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
      margin-left: 10px; background: #0A1120; color: #E8EDF5;
      font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 6px;
      white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.15s;
      border: 1px solid #263554; z-index: 1000;
    }
    .tooltip-wrap:hover .tooltip { opacity: 1; }
    .sidebar:not(.collapsed) .tooltip { display: none; }

    /* ── Page header ── */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .page-header h1 { font-size: 20px; font-weight: 700; }
    .page-header-actions { display: flex; gap: 8px; align-items: center; }

    /* ── Cards ── */
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .card.flush { padding: 0; overflow: hidden; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: var(--radius-sm); font-weight: 600; font-family: var(--font);
      cursor: pointer; transition: all var(--transition); border: none; line-height: 1;
      padding: 9px 16px; font-size: 13px;
    }
    .btn.sm { padding: 6px 12px; font-size: 12px; }
    .btn.lg { padding: 12px 22px; font-size: 14px; }
    .btn--primary { background: var(--accent); color: #fff; }
    .btn--primary:hover { background: var(--accent-hover); }
    .btn--secondary { background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border); }
    .btn--ghost { background: transparent; color: var(--text-secondary); }
    .btn--ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
    .btn--danger { background: var(--expense-light); color: var(--expense); }
    .btn--income { background: var(--income-light); color: var(--income); }

    /* ── Badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 700;
      background: var(--accent-light); color: var(--accent);
    }
    .badge--income  { background: var(--income-light);  color: var(--income); }
    .badge--expense { background: var(--expense-light); color: var(--expense); }
    .badge--warning { background: var(--warning-light); color: var(--warning); }
    .badge--info    { background: var(--info-light);    color: var(--info); }
    .badge--muted   { background: var(--border);        color: var(--text-secondary); }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab {
      padding: 10px 18px; font-size: 14px; font-weight: 500;
      color: var(--text-secondary); background: transparent; border: none;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      cursor: pointer; transition: all var(--transition);
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:hover:not(.active) { color: var(--text-primary); }

    /* ── Tables ── */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      padding: 12px 16px; text-align: left; font-size: 11px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;
    }
    .data-table th.right, .data-table td.right { text-align: right; }
    .data-table tbody tr { border-bottom: 1px solid var(--border-light); transition: background var(--transition); }
    .data-table tbody tr:last-child { border-bottom: none; }
    .data-table tbody tr:hover { background: var(--bg-hover); }
    .data-table td { padding: 11px 16px; font-size: 13px; }

    /* ── List rows ── */
    .list-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; transition: background var(--transition);
    }
    .list-row.bordered { border-bottom: 1px solid var(--border-light); }
    .list-row:hover { background: var(--bg-hover); }

    /* ── Panel (dashboard) ── */
    .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
    .panel__head {
      padding: 11px 16px 10px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
      cursor: grab;
    }
    .panel__head:active { cursor: grabbing; }
    .panel__title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
    .panel__body { padding: 14px 16px; flex: 1; overflow: hidden; }
    .grip { display: flex; flex-shrink: 0; opacity: 0.5; color: var(--text-muted); }
    .panel-dragging { opacity: 0.35; }
    .panel-ghost { outline: 2px solid var(--accent); border-radius: var(--radius); }

    /* ── Progress bars ── */
    .pbar { height: 8px; background: var(--bg-hover); border-radius: 4px; overflow: hidden; }
    .pbar > div { height: 100%; border-radius: 4px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
    .pbar.sm { height: 6px; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; backdrop-filter: blur(4px);
    }
    .modal-box {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 24px; width: 560px;
      max-width: 95vw; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-header h3 { font-size: 16px; font-weight: 700; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1/-1; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }

    /* ── Grid helpers ── */
    .grid { display: grid; gap: 16px; align-items: start; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }

    .fade-in { animation: fadeIn 0.22s ease; }
    @keyframes fadeIn { from { transform: translateY(6px); opacity: 0.4; } to { transform: translateY(0); opacity: 1; } }

    .muted { color: var(--text-muted); }
    .sec { color: var(--text-secondary); }
    .nowrap { white-space: nowrap; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-8 { gap: 8px; }
    .gap-12 { gap: 12px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page"></main>
    </div>
  </div>
  <div id="modal-root"></div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/lancamentos.js"></script>
  <script src="js/orcamento.js"></script>
  <script src="js/relatorios.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
