name: cdb-judas

services:
  backend:
    build:
      context: .
      dockerfile: br-application/src/main/docker/Dockerfile.backend
      network: host
      args:
        APP_VERSION: "1.0.0"
    image: cdb-judas-backend:1.0.0
    container_name: cdb-judas-backend
    environment:
      STORAGE_JSON_PATH: /data
      APP_LOGLEVEL_ROOT: INFO
    ports: ["8080:8080"]
    # A configuração do container sobrescreve a da imagem só para apontar o H2 ao
    # volume: com o `jdbc:h2:file:./database` do application.yaml da raiz o banco
    # nasceria em /app e sumiria a cada recriação.
    volumes:
      - ./data:/data
      - ./br-application/src/main/docker/application.docker.yaml:/app/application.yaml:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: br-application/src/main/docker/Dockerfile.frontend
      args:
        APP_VERSION: "1.0.0"
    image: cdb-judas-frontend:1.0.0
    container_name: cdb-judas-frontend
    ports: ["8081:80"]
    depends_on: [backend]
    restart: unless-stopped
