# ============================================================================
# nginx site config (drop-in para /etc/nginx/conf.d/default.conf).
#
# Serve o frontend estático E faz proxy reverso das rotas do backend no MESMO
# host/porta. O JS do frontend usa window.API_BASE_URL = '/api' (same-origin)
# para origens http, então estático e API precisam conviver aqui.
#
# O backend Spring Boot é alcançável na rede do compose em http://backend:8080.
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------------
    # Cabeçalhos comuns de proxy, reaproveitados por cada location de backend.
    # Host + X-Forwarded-* permitem ao Spring Security reconstruir a requisição
    # original; os cookies (sessão/auth) são repassados automaticamente pelo
    # nginx, então o login baseado em sessão funciona através do proxy.
    # ------------------------------------------------------------------------

    # ------------------------------------------------------------------------
    # SSE: stream de eventos em /api/{uuid}/stream (regex ^/api/.+/stream$).
    # Esta location usa regex (~) e por isso é avaliada ANTES do prefixo /api/,
    # garantindo precedência. Buffering/cache DESLIGADOS: caso contrário o nginx
    # acumularia os eventos e o cliente os receberia em lote/atrasados.
    # ------------------------------------------------------------------------
    location ~ ^/api/.+/stream$ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # ------------------------------------------------------------------------
    # API REST: todos os demais /api/... (endpoints sob o namespace do uuid).
    # ------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------------
    # Autenticação Spring Security (login/logout via POST de formulário).
    # ------------------------------------------------------------------------
    location = /login {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------------
    # Documentação OpenAPI / Swagger UI (springdoc) e specs em /v3/api-docs.
    # ------------------------------------------------------------------------
    location /swagger {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------------
    # Actuator (health/metrics) — opcional, incluído por conveniência.
    # ------------------------------------------------------------------------
    location /actuator {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------------
    # Assets estáticos versionados: cache curto (1h). Nunca casa index.html.
    # ------------------------------------------------------------------------
    location ~* \.(css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------------
    # Site estático com fallback estilo SPA. index.html nunca é cacheado para
    # que novas versões do app sejam buscadas a cada navegação.
    # ------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
